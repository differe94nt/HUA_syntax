<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>語法偏誤任務單 · 網站 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
/* 和「詞網與AI偏誤工作坊」同一套版面：上方組別列＋頁籤，一次一頁（最寬 860px），下方上一頁／下一頁。教師端放寬到 1100px。 */
[hidden]{display:none!important} img{max-width:100%}
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface2:#e8edf1; --fg:#17212b; --muted:#566271; --line:#d0d8e0;
  --accent:#1d5f7a; --accent-fg:#ffffff; --accent-soft:#d9eaf2;
  --mark:#c0392b; --mark-soft:#fbe3df;
  --human:#1f7a5c; --human-soft:#dcf0e6; --ai:#6b3fb8; --ai-soft:#e9e0f8;
  --ok:#2e7d32; --warn:#9a5b00; --warn-soft:#fbefd9;
  --font-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121820; --surface:#1b222b; --surface2:#252e39; --fg:#e9eef3; --muted:#9ba7b4; --line:#34404c;
  --accent:#6fb6d4; --accent-fg:#0f1a21; --accent-soft:#1d3540;
  --mark:#ff8a75; --mark-soft:#4a2520;
  --human:#6fd0a8; --human-soft:#1d3a2e; --ai:#c4a7f5; --ai-soft:#332647;
  --ok:#7ad48a; --warn:#f0b24a; --warn-soft:#3d2e14; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121820; --surface:#1b222b; --surface2:#252e39; --fg:#e9eef3; --muted:#9ba7b4; --line:#34404c;
  --accent:#6fb6d4; --accent-fg:#0f1a21; --accent-soft:#1d3540;
  --mark:#ff8a75; --mark-soft:#4a2520;
  --human:#6fd0a8; --human-soft:#1d3a2e; --ai:#c4a7f5; --ai-soft:#332647;
  --ok:#7ad48a; --warn:#f0b24a; --warn-soft:#3d2e14; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.7;margin:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:900}
h2{font-size:clamp(1.4rem,3.6vw,2rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0;max-width:65ch}
a{color:var(--accent)}
code{font-size:.9em;background:var(--surface2);padding:0 4px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.kicker{font-size:.8rem;letter-spacing:.1em;color:var(--accent);font-weight:700}
.kicker.human{color:var(--human)} .kicker.ai{color:var(--ai)} .kicker.warn{color:var(--warn)}
.lead{font-size:1.08rem;color:var(--muted)}
.wrap{width:100%;max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 32px}
.wrap.wide{max-width:1100px}
.page{display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.soft{background:var(--surface2);border-color:transparent}
.card.human{border-top:5px solid var(--human)} .card.ai{border-top:5px solid var(--ai)}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:600;background:var(--surface2);color:var(--fg)}
.chip.human{background:var(--human-soft);color:var(--human)} .chip.ai{background:var(--ai-soft);color:var(--ai)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.mark{background:var(--mark-soft);color:var(--mark)}

/* top bars */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.top .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.top .gname{font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.rail button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;font-weight:600;white-space:nowrap;cursor:pointer}
.rail button.on{background:var(--accent);color:var(--accent-fg)}
.rail button.ai.on{background:var(--ai);color:var(--bg)}
.rail button.done::after{content:" ✓"}
.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:4}
.foot-in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.foot .pos{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* controls */
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:9px 16px;font-weight:600;font-size:.95rem;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.82rem}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--bg)}
.btn.ai.ghost{background:transparent;color:var(--ai)}
.btn.human{background:var(--human);border-color:var(--human);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface2)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
label.f,.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
.f .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=password],select,textarea{font:inherit;font-weight:400;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.6}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[readonly],textarea[readonly]{background:var(--surface2)}
.dirty{border-color:var(--warn)!important}
::placeholder{color:var(--muted);opacity:.75}
.status{font-size:.8rem;color:var(--muted)}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
/* radio / checkbox chips */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;font-size:.9rem;cursor:pointer;background:var(--surface)}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opts label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opts label:has(input:disabled){cursor:default}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-weight:400;cursor:pointer;padding:6px 8px;border-radius:8px}
.checks label:has(input:checked){background:var(--accent-soft)}
.checks input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--accent)}

/* steps */
.todo{counter-reset:t;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.todo li{counter-increment:t;display:grid;grid-template-columns:34px 1fr;gap:12px}
.todo li>div{min-width:0}
.todo li::before{content:counter(t);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.todo.ai li::before{background:var(--ai-soft);color:var(--ai)}

/* text + tokens */
.sent{font-family:var(--font-display);font-size:1.12rem;line-height:2.1}
.tok{display:inline-block;padding:0 2px;border-radius:4px;border:1px solid transparent;background:none;font:inherit;color:inherit;line-height:1.6;margin:2px 0;cursor:pointer;position:relative}
.tok.sp{min-width:.7em}
button.tok{border-bottom:1px dashed var(--line)}
button.tok:hover{border-color:var(--accent)}
button.tok:disabled{cursor:default;border-bottom-color:transparent}
.tok.noted{box-shadow:inset 0 -3px 0 var(--mark)}
.tok.sel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)!important;font-weight:700}
.tok.hl{background:var(--mark-soft);color:var(--mark)}
.tok:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tok sup{font-family:var(--font-body);font-size:.6em;font-weight:700;color:var(--mark);margin-left:1px}
span.tok{cursor:default}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.selbar .what{flex:1 1 200px;min-width:0}
.note{border-left:4px solid var(--mark)}
.nn{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--mark-soft);color:var(--mark);font-weight:700;align-items:center;justify-content:center;font-size:.85rem;flex:0 0 auto}
.mk{font-family:var(--font-display);color:var(--mark)}
.nlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.nlist li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:.92rem}

/* misc */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.flow>div{border-radius:10px;padding:12px;background:var(--surface);border:1px solid var(--line)}
.flow>div.off{background:transparent;border-style:dashed;color:var(--muted)}
.flow b{display:block;font-family:var(--font-display);font-size:1.05rem}
.flow .t{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted)}
.tpl{position:relative;background:var(--surface2);border-radius:8px;padding:12px 84px 12px 12px;font-size:.92rem;white-space:pre-wrap;word-break:break-word;line-height:1.6;border:1px dashed var(--line)}
.tpl .copy{position:absolute;top:8px;right:8px}
.must{border:2px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
details.help summary{cursor:pointer;font-weight:600;color:var(--accent)}
.banner{border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 14px;border-radius:8px;font-size:.92rem;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-bottom:16px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.score{display:flex;gap:8px;flex-wrap:wrap}
.score label{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-family:var(--font-display);font-size:1.2rem}
.score input{position:absolute;opacity:0;pointer-events:none}
.score label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.score label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.lockbox{border:1px solid var(--human);background:var(--human-soft);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:.92rem}
.ans{background:var(--surface2);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-size:.95rem}
.ans.empty{color:var(--muted);font-style:italic}
.ans.long{max-height:16em;overflow:auto;font-size:.88rem}
.refbox{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:.9rem;white-space:pre-wrap}

/* login */
.gpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gpick button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px 8px;text-align:center}
.gpick button strong{display:block;font-family:var(--font-display);font-size:1.4rem}
.gpick button span{font-size:.75rem;color:var(--muted)}
.gpick button:hover{border-color:var(--accent)}
.gpick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* HTML 成品 */
.drop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.drop.over,.drop:focus-visible{border-color:var(--ai);outline:none}
.pv{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.pv iframe{display:block;width:100%;height:460px;border:0;background:#fff}
.pv .pvmsg{padding:24px;color:#566271;font-size:.9rem;text-align:center}
.pv.mini{aspect-ratio:4/3;cursor:zoom-in}
.pv.mini iframe{position:absolute;top:0;left:0;width:250%;height:250%;transform:scale(.4);transform-origin:0 0;pointer-events:none}
.pv.mini .pvmsg{padding:12px}
.pv.mini.none{aspect-ratio:auto;cursor:default;background:var(--surface2);border-style:dashed}
.pv.mini.none .pvmsg{color:var(--muted)}
.pvbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,14,20,.6);display:flex;flex-direction:column;padding:12px}
.overlay .ohead{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);color:var(--fg);border-radius:10px 10px 0 0;padding:8px 12px}
.overlay iframe{flex:1;width:100%;border:0;background:#fff;border-radius:0 0 10px 10px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.shot{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.shot a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);aspect-ratio:4/3}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}

/* teacher */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:.8rem}
.scroll{overflow-x:auto}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gcell{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);text-align:left;color:var(--fg)}
.gcell .n{font-family:var(--font-display);font-size:1.2rem;font-weight:700}
.gcell.test{border-style:dashed;margin-top:4px;width:100%;max-width:280px}
.testpick{border:1px dashed var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;text-align:left;font-weight:600}
.testpick span{display:block;font-weight:400;font-size:.78rem;color:var(--muted);margin-top:2px}
.testpick:hover{border-color:var(--accent)}
.testpick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dots{display:flex;gap:4px;margin-top:6px}
.dots span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots span.on{background:var(--ok)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) 120px 3em;gap:10px;align-items:center;font-size:.92rem}
.bars .track{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bars .fill{height:100%;background:var(--accent)}
.bars .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.qrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.qr{display:flex;gap:12px;align-items:center}
.qr .code{background:#fff;padding:6px;border-radius:6px;flex:0 0 auto;width:132px;height:132px}
.qr .code img,.qr .code canvas{width:120px!important;height:120px!important}
.wall{display:flex;flex-direction:column;gap:14px}
.wall .pair{display:grid;grid-template-columns:5em 1fr 1fr;gap:10px;align-items:start}
.proj .sent{font-size:1.45rem}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:560px){ .wall .pair{grid-template-columns:1fr} .bars .b{grid-template-columns:minmax(0,1fr) 70px 2.5em} }
@media (prefers-reduced-motion:no-preference){ .page{animation:in .22s ease-out} @keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>window.SYN_PART=1;</script>
<script>
// =====================================================================
//  AI 輔助華語分級課室語言設計與語法分析－偏誤語料 · 課堂設定檔
//  這是唯一需要編輯的檔案。改完後執行 `python3 build.py`，
//  dist/part1.html（網站 1）與 dist/part2.html（網站 2）會自動更新。
//  （直接用瀏覽器開 src/tasks.html 也會讀到這裡的設定；加 ?part=2 看網站 2。）
// =====================================================================
window.SYN_CONFIG = {

  // ---- 基本 ----
  title: 'AI 輔助華語分級課室語言設計與語法分析',
  subtitle: '偏誤語料',
  teacherCode: 'syn2026',          // 教師端通關碼
  totalGroups: 15,                 // 全班組數
  coctUrl: 'https://coct.naer.edu.tw/segment.jsp',   // 華語分級斷詞工具
  // 教師端 QR code 連到的兩個學生網址
  part1Url: 'https://differe94nt.github.io/HUA_syntax/dist/part1.html',
  part2Url: 'https://differe94nt.github.io/HUA_syntax/dist/part2.html',

  // ---- 學生答案要存到哪裡 ----
  // 填了 Google Apps Script 網址：答案存到你的 Google 試算表，HTML 成品與截圖存到你的雲端硬碟
  // （設定步驟見 backend/README.md）。空白：只存在學生自己的裝置，最後用「複製本組答案」交卷。
  sheetEndpoint: 'https://script.google.com/macros/s/AKfycbzmJmvohsquhq03G0MpQeukKAW5k-ytLOTzNM7E-pp1kNEJLH0eUEjHt_DzmcDWhGSr/exec',               // 例：'https://script.google.com/macros/s/XXXX/exec'
  sheetPollSeconds: 8,

  // ---- 階段（教師端「通知全班目前階段」與學生端橫幅）----
  // part：在哪一個網站。1–3 在網站 1，4–5 在網站 2。開場說明 2 分鐘不列在這裡。
  stages: [
    { n: 1, title: '人工標註', min: 8, part: 1 },
    { n: 2, title: '引導 AI',  min: 7, part: 1 },
    { n: 3, title: '檢核 AI',  min: 5, part: 1 },
    { n: 4, title: '回饋修正', min: 6, part: 2 },
    { n: 5, title: '學到的一件事情',   min: 2, part: 2 },
  ],

  // ---- 階段 2 唯一的規定：prompt 最後一定要加的一句話（學生可以一鍵複製）----
  requiredLine: '最後，請把做好的工具存成一個完整的 HTML 檔讓我下載；如果沒辦法下載，請給我一段完整、可以直接複製的 HTML 程式碼（從 <!DOCTYPE html> 一直到 </html>）。',

  // ---- 分級對照（階段 3 用 COCT 檢查 AI 給學習者的說明）----
  levels: {
    '初級': 'TBCL 第 1–3 級（基礎）',
    '中級': 'TBCL 第 4–5 級（進階）',
    '高級': 'TBCL 第 6–7 級（精熟）',
  },

  // ---- 偏誤類型（階段 1 標註用）----

// ====== 小工具 ======

function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null }catch(e){ return null } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true }catch(e){ return false } }
function lsDel(k){ try{ localStorage.removeItem(k) }catch(e){} }
const now=()=>new Date().toISOString();
const fmtTime=iso=>iso?new Date(iso).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}):'';
const mmss=sec=>{ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0') };
const kb=n=>n>=1024*1024?(n/1024/1024).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200) }
function copyText(text){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();

  if(!navigator.clipboard||!navigator.clipboard.writeText){ fallback(); return Promise.resolve() }
  return navigator.clipboard.writeText(text).then(()=>toast('已複製'),fallback);
}
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);

// ---- 合併：只改有改動的欄位；標註以 id 為單位合併，組員同時新增不會互相蓋掉 ----
function notesOps(base,draft){
  const b=new Map((base||[]).map(n=>[n.id,JSON.stringify(n)])), ids=new Set((draft||[]).map(n=>n.id));
  return { upsert:(draft||[]).filter(n=>b.get(n.id)!==JSON.stringify(n)), del:[...b.keys()].filter(id=>!ids.has(id)) };
}
function applyNotes(list,ops){
  const out=(list||[]).filter(n=>!ops.del.includes(n.id));
  ops.upsert.forEach(n=>{ const i=out.findIndex(x=>x.id===n.id); if(i>=0) out[i]=n; else out.push(n) });
  return out;
}
function applyPatch(doc,p){
  const d=JSON.parse(JSON.stringify(doc||{})), cur=Object.assign({},d[p.sec],p.set||{});
  if(p.notes) cur.notes=applyNotes(cur.notes,p.notes);
  cur.at=now(); d[p.sec]=cur; d.group=S.group; if(p.text&&!d.text) d.text=p.text; d.updatedAt=now();
  return d;
}
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';
const noop=()=>{};
// 標註：把點選的詞接起來，不相連的地方用「…」
function spanText(toks,tokens){ const s=[...toks].sort((a,b)=>a-b); let out=''; s.forEach((i,j)=>{ if(j&&i!==s[j-1]+1) out+='…'; out+=tokens[i]||'' }); return out }
const noteLine=(n,i)=>`${i+1}. 【${n.type||'？'}】${n.text||''} → ${n.fix||''}${n.why?'｜'+n.why:''}`;
// 匯出／摘要用：把各種值變成一格文字
function plain(v){
  if(v==null) return '';
  if(Array.isArray(v)){
    if(v.length&&v[0]&&typeof v[0]==='object'&&'toks' in v[0]) return v.map(noteLine).join('\n');
    if(v.length&&v[0]&&typeof v[0]==='object') return v.map(x=>x.url||x.name||'').join('\n');
    return v.join('、');
  }
  if(typeof v==='object') return v.url||v.name||'';
  return String(v);
}

// ====== 儲存後端 ======
// 兩種後端共用同一組介面，其他程式只透過 S.store 存取：
//   saveGroup(id,data) saveSettings(data) watchGroup(id,cb) watchGroups(cb) watchSettings(cb)
//   saveHtml({group,slot,name,source,html}) → files    getHtml(group,slot) → html
//   upload({group,slot,name,mime,data}) → shots        unshot(group,slot,fileId) → shots（只有試算表有）
function makeLocalStore(){
  return { mode:'local',
    async saveGroup(id,data){ lsSet(LS.data+id.slice(1),data) },
    async patchGroup(id,p){ const d=applyPatch(lsGet(LS.data+id.slice(1))||S.data,p); lsSet(LS.data+id.slice(1),d); return d },
    async resetGroup(id,text){ const d={group:TEST,text,resetAt:now(),updatedAt:now()}; lsSet(LS.data+id.slice(1),d); ['v1','v2'].forEach(s=>lsDel(LS.html+id+':'+s)); return d },
    async saveSettings(){ throw new Error('local') },
    watchGroup(){ return noop }, watchGroups(){ return noop }, watchSettings(){ return noop },
    async saveHtml(o){
      const meta={name:o.name,size:o.html.length,source:o.source,savedAt:now(),local:true};
      if(!lsSet(LS.html+o.group+':'+o.slot,o.html)) meta.memoryOnly=true;
      return Object.assign({},S.data.files,{[o.slot]:meta});
    },
    async getHtml(group,slot){ const h=lsGet(LS.html+group+':'+slot); if(h==null) throw new Error('這台裝置上沒有這個檔案'); return h },
  };
}
// Google 試算表（Apps Script 網頁應用程式；程式碼在 backend/google_sheets.gs）。
// 儲存＝POST JSON；更新＝定時 GET。POST 用 text/plain 可避開 CORS 預檢。
function makeSheetStore(url){
  const POLL=Math.max(3,+C.sheetPollSeconds||8)*1000;
  let cache={groups:{},settings:{}}, timer=null, pulling=false;
  const L={group:new Map(),groups:new Set(),settings:new Set()};
  const withQ=q=>url+(url.includes('?')?'&':'?')+q;
  async function post(body){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'save failed'); return j;
  }
  async function get(q){
    const r=await fetch(withQ(q+'&_='+Date.now()),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'load failed'); return j;
  }
  // 學生只抓自己這一組，只有教師端抓全班
  function query(){
    const ids=[...L.group.keys()].filter(id=>L.group.get(id).size);
    if(L.groups.size||ids.length>1) return 'action=all';
    return 'action=group&id='+encodeURIComponent(ids[0]||'none');
  }
  async function pull(){
    if(pulling) return; pulling=true;
    try{ const q=query(), j=await get(q);
      if(q==='action=all') cache.groups=j.groups||{}; else Object.assign(cache.groups,j.groups||{});
      cache.settings=j.settings||{}; notify(); }
    finally{ pulling=false }
  }
  function notify(){
    L.groups.forEach(cb=>cb(cache.groups));
    L.settings.forEach(cb=>cb(cache.settings.class||{}));
    L.group.forEach((set,id)=>{ if(cache.groups[id]) set.forEach(cb=>cb(clone(cache.groups[id]))) });
  }
  function ensurePolling(){ if(timer) return; timer=setInterval(()=>{ if(document.visibilityState==='visible') pull().catch(noop) },POLL) }
  const sub=(set,cb,initial)=>{ set.add(cb); if(initial!==undefined) cb(initial); ensurePolling(); pull().catch(noop); return ()=>set.delete(cb) };
  // HTML 與截圖清單由試算表另外管理；這裡只更新快取
  function patch(id,key,val){ const d=cache.groups[id]||{}; cache.groups[id]=Object.assign({},d,{[key]:val}) }
  return { mode:'sheet',
    async saveGroup(id,data){ await post({type:'group',id,data,by:DEV}); cache.groups[id]=clone(data); notify() },
    async patchGroup(id,p){ const j=await post(Object.assign({type:'patch',id,by:DEV},p)); cache.groups[id]=clone(j.doc); notify(); return clone(j.doc) },
    async resetGroup(id,text){ const j=await post({type:'reset',id,text,by:DEV}); cache.groups[id]=clone(j.doc); notify(); return clone(j.doc) },
    async saveSettings(data){ await post({type:'settings',id:'class',data}); cache.settings.class=clone(data); notify() },
    watchGroup(id,cb){ if(!L.group.has(id)) L.group.set(id,new Set()); return sub(L.group.get(id),cb,cache.groups[id]&&clone(cache.groups[id])) },
    watchGroups:cb=>sub(L.groups,cb,cache.groups),
    watchSettings:cb=>sub(L.settings,cb,cache.settings.class||{}),
    async saveHtml(o){ const j=await post({type:'html',id:o.group,slot:o.slot,name:o.name,source:o.source,html:o.html,by:DEV}); patch(o.group,'files',j.files||{}); return j.files||{} },
    async getHtml(group,slot){ const j=await get('action=html&id='+encodeURIComponent(group)+'&slot='+encodeURIComponent(slot)); return String(j.html||'') },
    async upload(o){ const j=await post({type:'upload',id:o.group,slot:o.slot,name:o.name,mime:o.mime,data:o.data,by:DEV}); patch(o.group,'shots',j.shots||{}); return j.shots||{} },
    async unshot(group,slot,fileId){ const j=await post({type:'unshot',id:group,slot,fileId,by:DEV}); patch(group,'shots',j.shots||{}); return j.shots||{} },
    ping:()=>get('action=ping'),
  };
}

// 沒存成功的話，草稿留著（框線維持橘色），再按一次儲存就好。
async function saveSection(sec,extra){
  if(!hasGroup()) return false;
  const set={}, sent={};
  FIELDS[sec].forEach(f=>{ const k=sec+'.'+f; if(f==='notes'||!(k in S.draft)) return;
    let x=S.draft[k]; if(typeof x==='string') x=x.trim(); set[f]=x; sent[k]=JSON.stringify(S.draft[k]) });
  Object.assign(set,extra||{});
  const patch={sec,set,text:textFor(S.group).id};
  if(sec==='s1'&&'s1.notes' in S.draft){ patch.notes=notesOps(getPath(S.data,'s1.notes'),S.draft['s1.notes']); sent['s1.notes']=JSON.stringify(S.draft['s1.notes']) }
  const gid='g'+S.group;
  showSaved(sec,remote()?false:undefined);
  let ok=true;
  try{
    let doc;
    try{ doc=await S.store.patchGroup(gid,patch) }
    catch(e){ if(!remote()||!/type 不合法/.test(e&&e.message||'')) throw e;
      doc=applyPatch(S.data,patch); await S.store.saveGroup(gid,doc) }   // 後端還是舊版：整份存
    if(gid!=='g'+S.group) return false;   // 存的時候換組了
    S.data=doc; lsSet(LS.data+S.group,S.data);
    // 只清掉送出去、而且送出後沒有再改的草稿
    Object.keys(sent).forEach(k=>{ if(k in S.draft&&JSON.stringify(S.draft[k])===sent[k]) delete S.draft[k] });
    flushDrafts();
    $$('[data-k^="'+sec+'."]').forEach(el=>{ if(!(el.dataset.k in S.draft)) el.classList.remove('dirty') });
    if(sec==='s1'&&!('s1.notes' in S.draft)) $$('#notesList .dirty').forEach(el=>el.classList.remove('dirty'));
    showSaved(sec,true); toast(remote()?'已儲存':'已存在這台裝置');
  }catch(e){ ok=false; showSaved(sec); toast('沒有存到：'+(e&&e.message||e)+'。內容還在，請再按一次儲存') }
  renderRail(); syncFields();
  return ok;
}
function showSaved(sec,server){

    const at=S.data[sec]&&S.data[sec].at, dirty=Object.keys(S.draft).some(k=>k.startsWith(sec+'.'));

    else if(remote()){ el.textContent=(dirty?'有修改還沒儲存 · 上次 ':'已儲存 · ')+fmtTime(at); el.className='status '+(dirty?'warn':'ok') }
    else { el.textContent='已存在這台裝置 · '+fmtTime(at); el.className='status warn' }
  });
}

function subscribeGroup(){
  if(!S.store||!remote()||!hasGroup()) return;

    // 只接受不比手上舊的資料，避免輪詢時把剛存的答案蓋掉
    if(S.data.updatedAt&&data.updatedAt&&data.updatedAt<S.data.updatedAt) return;

    if(isLocked()){ Object.keys(S.draft).filter(k=>k==='s1.notes'||k==='s1.guide').forEach(k=>delete S.draft[k]) }
    else if('s1.notes' in S.draft){

// 學生常會連 AI 的說明文字、```html 一起貼上；這裡只留下 HTML
function cleanHtml(s){
  s=String(s||'').replace(/^﻿/,'').trim();
  const fence=s.match(/```[ \t]*(?:html|HTML|htm)?[ \t]*\r?\n([\s\S]*?)```/);
  if(fence&&/<[a-z!]/i.test(fence[1])) s=fence[1].trim();
  const start=s.search(/<!doctype html|<html[\s>]/i); if(start>0) s=s.slice(start);
  const end=s.toLowerCase().lastIndexOf('</html>'); if(end>=0) s=s.slice(0,end+7);
  return s;
}

async function imageToJpeg(file){
  const src=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('讀不到這張圖片')); im.src=src });
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*k)); c.height=Math.max(1,Math.round(img.naturalHeight*k));
    const ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',0.85).split(',')[1];
  } finally { URL.revokeObjectURL(src) }
}

  for(let i=0;i<files.length;i++){
    const msg=$('#sb-'+slot+' [data-smsg]'); if(msg) msg.textContent='上傳中 '+(i+1)+' / '+files.length+'…';

}

const gdoc=g=>S.t.groups['g'+g]||{};
const DOTS=[['標註','s1'],['AI 第一版','ai1'],['檢核','s3'],['反思','p2'],['修正','ai2'],['一句話','end']];
// 每個詞有幾組標了（同一組標兩次只算一次）
function heatFor(t){
  const cnt=new Array(t.tokens.length).fill(0), types=t.tokens.map(()=>({})); let n=0;
  t.groups.forEach(g=>{ const notes=getPath(gdoc(g),'s1.notes')||[]; if(!notes.length) return; n++; const seen=new Set();
    notes.forEach(nt=>(nt.toks||[]).forEach(i=>{ if(cnt[i]==null) return; if(!seen.has(i)){ cnt[i]++; seen.add(i) } if(nt.type) types[i][nt.type]=(types[i][nt.type]||0)+1 })) });
  const html=t.tokens.map((tok,i)=>{ const r=n?cnt[i]/n:0;
    const st=r?`background:color-mix(in srgb, var(--mark) ${Math.round(20+r*60)}%, var(--surface));${r>0.5?'color:var(--accent-fg);font-weight:700':''}`:'';
    const tip=cnt[i]?`${cnt[i]} 組 · `+Object.entries(types[i]).map(([k,v])=>k+' '+v).join('、'):'';
    return `<span class="tok" style="${st}" title="${esc(tip)}">${tok.trim()?esc(tok):'&nbsp;'}${cnt[i]?`<sup style="color:inherit">${cnt[i]}</sup>`:''}</span>` }).join('');
  return {n,html};
}
function bars(items,total){
  return `<div class="bars">${items.map(([label,c])=>`<div class="b"><span>${esc(label)}</span><span class="track"><span class="fill" style="display:block;width:${total?Math.round(c/total*100):0}%"></span></span><span class="num">${c}/${total}</span></div>`).join('')}</div>`;
}
function loadScript(src){ return new Promise((res,rej)=>{ if([...document.scripts].some(s=>s.src===src)){ res(); return } const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s) }) }
function drawQRs(root){
  const els=$$('[data-qr]',root); if(!els.length) return;
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').then(()=>{
    els.forEach(el=>{ el.innerHTML=''; try{ new window.QRCode(el,{text:el.dataset.qr,width:120,height:120,correctLevel:window.QRCode.CorrectLevel.M}) }catch(e){} });
  }).catch(()=>els.forEach(el=>{ el.textContent='QR code 載入失敗' }));
}
function teacherSig(){
  const t=S.t, G=t.groups;
  if(t.tab==='group') return 'group:'+t.sel+':'+JSON.stringify(G['g'+t.sel]||{});
  if(t.tab==='proj'){ const ids=t.proj==='all'?Object.keys(G):(TEXTS.find(x=>x.id===t.proj)||TEXTS[0]).groups.map(g=>'g'+g); return 'proj:'+t.proj+':'+JSON.stringify(ids.map(id=>G[id]||null)) }
  return 'overview:'+JSON.stringify(Object.keys(G).map(id=>[id,G[id].updatedAt,G[id].files,(G[id].shots||{})]));
}
function renderTeacherBody(){
  const el=$('#tBody'); if(!el) return; const t=S.t;
  $$('[data-tab]',app).forEach(b=>b.classList.toggle('on',b.dataset.tab===t.tab));
  if(!remote()&&S.mode!=='pending'){ el.innerHTML=`<div class="card"><h2>沒有連到試算表</h2><p style="margin-top:8px">請在 <code>content/config.js</code> 填入 Google Apps Script 網址（見 backend/README.md）。顯示「存在本機」的組別，請他們按「複製本組答案」交給你。</p></div>`; t.sig=''; return }
  // 輪詢時資料沒變就不重畫，避免預覽一直重新載入
  const sig=teacherSig(); if(sig===t.sig&&el.childElementCount) return; t.sig=sig;
  const ans=v=>`<div class="ans ${v?'':'empty'}">${v?esc(v):'（尚未填寫）'}</div>`;
  if(t.tab==='overview'){
    el.innerHTML=`<div class="card stack">
      <h2>學生網址</h2>
      <div class="qrs">${[1,2].map(n=>PART_URL[n]?`<div class="qr"><div class="code" data-qr="${esc(PART_URL[n])}"></div><div class="stack" style="gap:6px;min-width:0"><strong>網站 ${n}</strong><span class="small muted">${n===1?'階段 1–3：標註、引導 AI、檢核':'階段 4–5：回饋修正、一句話'}</span><a class="small" href="${esc(PART_URL[n])}" target="_blank" rel="noopener" style="word-break:break-all">${esc(PART_URL[n])}</a><button class="btn sm ghost" data-copyurl="${n}" style="align-self:flex-start">複製網址</button></div></div>`:'').join('')}</div>
    </div>
    <div class="card stack">
      <div class="row between"><h2>各組進度</h2><span class="small muted">已開始 ${Object.keys(t.groups).filter(id=>id!=='g'+TEST).length} / ${TOTAL_GROUPS} 組</span></div>
      <div class="ggrid">${Array.from({length:TOTAL_GROUPS},(_,i)=>i+1).map(g=>{ const d=gdoc(g), tx=textFor(g); return `<button class="gcell" data-g="${g}"><div class="n">第 ${g} 組</div><div class="small muted">語料 ${tx.id} · ${esc(tx.level)}${d.updatedAt?' · '+fmtTime(d.updatedAt):''}</div><div class="dots" title="${DOTS.map(x=>x[0]).join(' / ')}">${DOTS.map(([,s])=>`<span class="${secDone(s,d)?'on':''}"></span>`).join('')}</div></button>` }).join('')}</div>
      <p class="small muted">六格依序是：${DOTS.map(x=>x[0]).join('、')}。點一組看答案。</p>
      ${(()=>{ const d=gdoc(TEST), tx=textFor(TEST); return `<button class="gcell test" data-g="${TEST}"><div class="n">🧪 測試組</div><div class="small muted">語料 ${tx.id} · ${esc(tx.level)}${d.updatedAt?' · '+fmtTime(d.updatedAt):''} · 不列入統計</div><div class="dots">${DOTS.map(([,s])=>`<span class="${secDone(s,d)?'on':''}"></span>`).join('')}</div></button>` })()}
    </div>`;
    $$('[data-g]',el).forEach(b=>b.addEventListener('click',()=>{ t.sel=+b.dataset.g; t.tab='group'; renderTeacherBody() }));
    $$('[data-copyurl]',el).forEach(b=>b.addEventListener('click',()=>copyText(PART_URL[b.dataset.copyurl])));
    drawQRs(el);
  }
  else if(t.tab==='group'){
    const g=t.sel, tx=textFor(g), d=gdoc(g), G=k=>getPath(d,k), notes=G('s1.notes')||[];
    const marked=new Map(); notes.forEach((n,ni)=>(n.toks||[]).forEach(i=>marked.set(i,ni)));
    const shotsOf=slot=>(G('shots.'+slot)||[]).length?`<div class="shots">${G('shots.'+slot).map(x=>shotFigure(x,slot,false)).join('')}</div>`:'';
    const htmlCard=slot=>`<div class="pvbar"><span class="small muted">HTML ${SLOT_NAME[slot]}${G('files.'+slot)?`${G('files.'+slot).versions>1?' · 第 '+G('files.'+slot).versions+' 次（顯示最新）':''} · ${esc(G('files.'+slot).source==='paste'?'貼上':'上傳')} · ${kb(G('files.'+slot).size||0)} · ${fmtTime(G('files.'+slot).savedAt)}`:''}</span>${G('files.'+slot)?`<span class="row" style="gap:6px"><button class="btn sm ghost" data-big="${slot}">放大</button><button class="btn sm ghost" data-dl="${slot}">下載</button>${safeUrl(G('files.'+slot).url)?`<a class="btn sm ghost" href="${esc(G('files.'+slot).url)}" target="_blank" rel="noopener">雲端硬碟</a>`:''}</span>`:''}</div>${pvBox('g'+g,slot,false)}${shotsOf(slot)}`;
    el.innerHTML=`
      <div class="row"><select id="selG" style="width:auto">${Array.from({length:TOTAL_GROUPS},(_,i)=>`<option value="${i+1}" ${g===i+1?'selected':''}>第 ${i+1} 組</option>`).join('')}<option value="${TEST}" ${g===TEST?'selected':''}>🧪 測試組</option></select><span class="small muted">語料 ${tx.id} · ${esc(tx.level)} · ${d.updatedAt?'最後更新 '+fmtTime(d.updatedAt):'尚未開始'}</span></div>
      ${g===TEST?testCard():''}
      <p class="small muted">這裡顯示每組最新的答案。每一次儲存、每一版 HTML 都另外記在試算表的 history 工作表（含舊版檔案連結）。</p>
      <div class="card human stack"><div class="row between"><span class="chip human">階段 1 · 人工標註（${notes.length} 個）</span><span class="small muted">${G('s1.locked')?'🔒 '+fmtTime(G('s1.lockedAt'))+' 鎖定':'未鎖定'}</span></div>
        <p class="sent">${tx.tokens.map((x,i)=>`<span class="tok ${marked.has(i)?'noted':''}">${x.trim()?esc(x):'&nbsp;'}</span>`).join('')}</p>
        ${notesSummary(d)}<span class="small muted">怎麼指導</span>${ans(G('s1.guide'))}</div>
      <div class="card ai stack"><span class="chip ai" style="align-self:flex-start">階段 2 · 引導 AI · ${esc(G('ai1.llm')||'—')} ${esc(G('ai1.llmNote')||'')}</span>
        <span class="small muted">prompt</span><div class="ans long ${G('ai1.prompt')?'':'empty'}">${esc(G('ai1.prompt'))||'（尚未填寫）'}</div>
        <span class="small muted">AI 的分析</span><div class="ans long ${G('ai1.reply')?'':'empty'}">${esc(G('ai1.reply'))||'（尚未填寫）'}</div>
        ${htmlCard('v1')}</div>
      <div class="card stack"><h3>階段 3 · 檢核 AI <span class="chip acc">AI 分數 ${esc(G('s3.score'))||'—'}</span></h3>
        <div class="grid g2"><div><span class="small muted">都找到</span>${ans(G('s3.hit'))}</div><div><span class="small muted">AI 漏掉</span>${ans(G('s3.miss'))}</div><div><span class="small muted">AI 誤判或改過頭</span>${ans(G('s3.over'))}</div><div><span class="small muted">超出程度的詞</span>${ans(G('s3.coctWords'))}</div><div><span class="small muted">分級觀察</span>${ans(G('s3.coctNote'))}</div><div><span class="small muted">想改標註</span>${ans(G('s3.rethink'))}</div></div></div>
      <div class="card stack"><h3>階段 4-1 · 檢視 prompt 與反思</h3>
        <div class="grid g2"><div class="stack" style="gap:6px"><span class="small muted">第一版 prompt 做到的（${(G('p2.had')||[]).length} / ${CHECKLIST.length}）</span><ul class="small" style="margin:0;padding-left:1.2em">${CHECKLIST.map(c=>`<li style="${(G('p2.had')||[]).includes(c)?'':'color:var(--muted);text-decoration:line-through'}">${esc(c)}</li>`).join('')}</ul><span class="small muted">最想補上</span>${ans(G('p2.missing'))}</div>
        <div class="stack" style="gap:6px"><span class="small muted">觀察到的 AI 偏好</span>${(G('p2.bias')||[]).length?`<ul class="small" style="margin:0;padding-left:1.2em">${G('p2.bias').map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:ans('')}<span class="small muted">例子</span>${ans(G('p2.biasNote'))}</div></div></div>
      <div class="card ai stack"><span class="chip ai" style="align-self:flex-start">階段 4-2 · 回饋修正 · ${esc(G('ai2.llm')||'—')} ${esc(G('ai2.llmNote')||'')}</span>
        <span class="small muted">修正指令</span><div class="ans long ${G('ai2.prompt')?'':'empty'}">${esc(G('ai2.prompt'))||'（尚未填寫）'}</div>
        <span class="small muted">AI 的回答</span><div class="ans long ${G('ai2.reply')?'':'empty'}">${esc(G('ai2.reply'))||'（尚未填寫）'}</div>
        ${htmlCard('v2')}<span class="small muted">改善與限制</span>${ans(G('ai2.change'))}</div>
      <div class="card stack"><h3>階段 5 · 一句話</h3>${ans(G('end.share'))}<span class="small muted">重來一次的 prompt</span>${ans(G('end.redo'))}</div>
      ${tx.ref?`<div class="refbox"><strong>教師參考（草稿）</strong><br>${esc(tx.ref)}</div>`:''}`;
    $('#selG').addEventListener('change',e=>{ t.sel=+e.target.value; renderTeacherBody() });
    bindTest(el);
    $$('[data-big]',el).forEach(b=>b.addEventListener('click',()=>{ const s=b.dataset.big; fetchHtml('g'+g,s,G('files.'+s)).then(h=>openOverlay(h,`${gName(g)} · ${SLOT_NAME[s]}`,fileName(g,s))).catch(()=>toast('讀不到檔案')) }));
    $$('[data-dl]',el).forEach(b=>b.addEventListener('click',()=>{ const s=b.dataset.dl; fetchHtml('g'+g,s,G('files.'+s)).then(h=>download(fileName(g,s),h,'text/html;charset=utf-8')).catch(()=>toast('讀不到檔案')) }));
    fillPreviews(el);
  }
  else if(t.tab==='proj'){
    const sw=`<div class="row">${TEXTS.map(x=>`<button class="btn sm ${t.proj===x.id?'':'ghost'}" data-ps="${x.id}">語料 ${x.id}（${esc(x.level)}，第 ${x.groups.join('、')} 組）</button>`).join('')}<button class="btn sm ${t.proj==='all'?'':'ghost'}" data-ps="all">全班總結</button></div>`;
    if(t.proj==='all'){
      const all=Array.from({length:TOTAL_GROUPS},(_,i)=>i+1).map(gdoc), n=all.filter(d=>d.updatedAt).length;
      const count=(k,opts)=>opts.map(o=>[o,all.filter(d=>(getPath(d,k)||[]).includes(o)).length]);
      const llm=LLMS.map(o=>[o,all.filter(d=>getPath(d,'ai1.llm')===o).length]).filter(x=>x[1]);
      el.innerHTML=`<div class="page proj">${sw}
        <div class="grid g2"><div class="card stack"><h2>用了哪個 AI</h2>${llm.length?bars(llm,n):'<p class="muted">還沒有資料。</p>'}</div>
          <div class="card stack"><h2>AI 修正時的偏好</h2>${bars(count('p2.bias',BIASES),n)}</div></div>
        <div class="card stack"><h2>第一版 prompt 做到了什麼</h2><p class="small muted">幾組的第一版 prompt 有這一項（學生自評）。</p>${bars(count('p2.had',CHECKLIST),n)}</div>
        <div class="card stack"><h2>AI 做不到、要靠我們的是……</h2>${Array.from({length:TOTAL_GROUPS},(_,i)=>i+1).map(g=>{ const v=getPath(gdoc(g),'end.share'); return v?`<div class="ans"><strong>第 ${g} 組</strong>　${esc(v)}</div>`:'' }).join('')||'<p class="muted">還沒有組別寫。</p>'}</div>
      </div>`;
    } else {
      const tx=TEXTS.find(x=>x.id===t.proj)||TEXTS[0], h=heatFor(tx);
      el.innerHTML=`<div class="page proj">${sw}
        <div class="card stack"><div class="kicker">語料 ${tx.id} · ${esc(tx.level)} · ${h.n} 組已標註</div><p class="sent">${h.html}</p><p class="small muted">顏色越深＝越多組標了這個地方；滑鼠停在詞上可以看偏誤類型。</p></div>
        <div class="card stack"><h2>各組比較</h2><div class="scroll"><table class="tbl"><tr><th>組</th><th>標註</th><th>偏誤類型</th><th>AI</th><th>AI 漏掉</th><th>AI 誤判</th><th>超出程度的詞</th><th>分數</th></tr>${tx.groups.map(g=>{ const d=gdoc(g), notes=getPath(d,'s1.notes')||[], ty={}; notes.forEach(n=>{ if(n.type) ty[n.type]=(ty[n.type]||0)+1 }); const G=k=>esc(getPath(d,k)||'—'); return `<tr><td><strong>${g}</strong></td><td>${notes.length}</td><td>${Object.entries(ty).map(([k,v])=>esc(k)+' '+v).join('、')||'—'}</td><td>${G('ai1.llm')}</td><td>${G('s3.miss')}</td><td>${G('s3.over')}</td><td>${G('s3.coctWords')}</td><td>${G('s3.score')}</td></tr>` }).join('')}</table></div></div>
        <div class="card stack"><h2>AI 做的輔具：第一版 → 修正版</h2><p class="small muted">點預覽可以放大操作。</p><div class="wall">${tx.groups.map(g=>`<div class="pair"><strong>第 ${g} 組</strong>${['v1','v2'].map(s=>{ const sh=getPath(gdoc(g),'shots.'+s)||[]; return `<div class="stack" style="gap:4px"><span class="small muted">${SLOT_NAME[s]}</span>${getPath(gdoc(g),'files.'+s)||!sh.length?pvBox('g'+g,s,true):shotFigure(sh[0],s,false)}</div>` }).join('')}</div>`).join('')}</div></div>
        <div class="card stack"><h2>一句話</h2>${tx.groups.map(g=>{ const v=getPath(gdoc(g),'end.share'); return `<div class="ans ${v?'':'empty'}"><strong>第 ${g} 組</strong>　${esc(v)||'（尚未填寫）'}</div>` }).join('')}</div>
        ${tx.ref?`<details class="card soft help"><summary>教師參考（草稿）</summary><div class="refbox" style="margin-top:8px">${esc(tx.ref)}</div></details>`:''}
      </div>`;
      fillPreviews(el);
    }
    $$('[data-ps]',el).forEach(b=>b.addEventListener('click',()=>{ t.proj=b.dataset.ps==='all'?'all':+b.dataset.ps; renderTeacherBody() }));
  }
}

// ====== 匯出 ======
function exportRows(){
  const rows=[EXPORT_COLUMNS.map(c=>c[0])];
  for(let g=1;g<=TOTAL_GROUPS;g++){ const d=gdoc(g); if(!d.updatedAt&&!d.files) continue; const tx=textFor(g);
    rows.push(EXPORT_COLUMNS.map(([n,k])=>n==='組'?g:n==='語料'?tx.id:n==='程度'?tx.level:n==='1標註數'?(getPath(d,'s1.notes')||[]).length:plain(getPath(d,k)))) }
  return rows;
}
async function download(filename,data,type){
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:type||'text/plain;charset=utf-8'})); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove() },500); return true }catch(e){ return false }
}
const stamp=()=>new Date().toISOString().slice(0,10);
async function exportCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='﻿'+exportRows().map(r=>r.map(q).join(',')).join('\n');
  if(!(await download('語法偏誤任務-'+stamp()+'.csv',csv,'text/csv;charset=utf-8'))) copyText(csv).then(()=>toast('已複製 CSV，可貼到試算表'));
}
async function exportJSON(){
  const json=JSON.stringify({exportedAt:now(),mode:S.mode,groups:S.t.groups},null,2);
  if(!(await download('語法偏誤任務-'+stamp()+'.json',json,'application/json'))) copyText(json).then(()=>toast('已複製 JSON'));
}

// ====== 啟動 ======
if(hasGroup()) loadGroup();
render();
initStore();
})();
</script>
